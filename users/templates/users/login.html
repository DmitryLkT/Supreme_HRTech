{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Altra</title><link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'onboarding/css/app.css' %}">
    {% include "onboarding/_splash_head.html" %}
</head>
<body class="login-page">
{% include "onboarding/_splash.html" %}
<main class="login-card card">
    <div class="brand"><span class="brand-logo" style="width:150px"><img class="logo-anim" src="{% static 'onboarding/img/altra-logo-anim.webp' %}" alt="Altra" width="150" height="67"><img class="logo-still" style="display:none" src="{% static 'onboarding/img/altra-logo.png' %}" alt="" aria-hidden="true" width="150" height="67"></span></div>
    <h1>Рады видеть тебя</h1><p class="muted">Войди, чтобы открыть материалы адаптации.</p>
    <form method="post" class="login-form">
        {% csrf_token %}{{ form.as_p }}
        <input type="hidden" name="next" value="{% url 'home' %}">
        <button type="submit" class="btn btn-primary">Войти →</button>
    </form>
</main>
<script src="{% static 'onboarding/js/theme-tuner.js' %}" defer></script>
</body>
</html>
