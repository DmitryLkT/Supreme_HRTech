<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет доступа — Altra</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0E0E0F;color:#E8E9EB;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
main{width:100%;max-width:480px;text-align:center}
.mark{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#9A9C9E;font-weight:600;margin-bottom:36px}
.code{font-size:96px;font-weight:600;letter-spacing:-.04em;line-height:1;margin:0;background:linear-gradient(180deg,#F0F1F2,#6E7074);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:24px;font-weight:600;margin:16px 0 8px}
p{margin:0 0 28px;color:#9A9C9E;font-size:16px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;background:linear-gradient(180deg,#E3E4E6,#B9BBBF);color:#111112;font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid #C6C8CB;outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="mark">Altra</div>
<p class="code" aria-hidden="true">403</p>
<h1>Сюда нельзя</h1>
<p>У твоей учётной записи нет доступа к этой странице. Если это ошибка, напиши HR.</p>
<a href="/">На главную</a>
</main>
</body>
</html>
